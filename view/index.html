    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
    body { font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    #detail, #results, .legend-card {
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }
    #detail::-webkit-scrollbar,
    #results::-webkit-scrollbar,
    .legend-card::-webkit-scrollbar { width: 6px; height: 0; }
    #detail::-webkit-scrollbar-thumb,
    #results::-webkit-scrollbar-thumb,
    .legend-card::-webkit-scrollbar-thumb { background: var(--line-strong); }
    #detail::-webkit-scrollbar-track,
    #results::-webkit-scrollbar-track,
    .legend-card::-webkit-scrollbar-track { background: transparent; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #app { height: 100%; background: var(--bg); }
    #work { height: 100%; min-height: 0; display: flex; position: relative; }
    #side {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 340px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--panel);
      border-right: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #side.is-collapsed {
      bottom: auto;
      width: 44px;
      height: 44px;
      border: 0;
      overflow: hidden;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #side.is-collapsed #side-head,
    #side.is-collapsed #detail { display: none; }
    #side-logo {
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      background: var(--panel);
      border: 0;
      border-right: 1px solid var(--edge);
      border-bottom: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #side.is-collapsed #side-logo { display: grid; }
    #side-head { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
    #title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #title { flex: 1; min-width: 0; overflow: hidden; font-size: 14px; letter-spacing: 0.08em; text-transform: lowercase; white-space: nowrap; }
    #side-tools { display: flex; align-items: center; gap: 4px; flex: none; }
    #side-toggle, #side-help {
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    #side-toggle:hover, #side-help:hover { color: var(--fg); border-color: var(--line-strong); }
    #crumb { color: var(--muted); min-height: 1.2em; overflow: hidden; white-space: nowrap; }
    #crumb button { background: transparent; color: var(--muted); border: 0; padding: 0; }
    #crumb button:hover { color: var(--fg); }
    .modes { display: flex; gap: 0; }
    .modes button {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 6px 8px;
    }
    .modes button + button { border-left: 0; }
    .modes button.on { color: var(--fg); background: var(--on); border-color: var(--line-strong); }
    #stage { position: absolute; inset: 0; background: var(--bg); }
    #view { position: absolute; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }
    /* The node's own header never scrolls away: the panel is a fixed head and a
       body of sections, and each section's rows scroll inside the section. */
    #detail { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    #detail-head { flex: none; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
    #detail-body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 0 0 18px; }
    #detail h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; }
    #detail p { margin: 0 0 8px; color: var(--muted); overflow: hidden; }

    /* Sections. An open one takes a share of the body and scrolls its own rows,
       so the other sections keep their headers on screen. */
    /* A collapsed section is its header: the body's flex basis is 0, so it
       contributes nothing until the section grows. Opening animates flex-grow,
       and an open body scrolls its own rows. `grid-template-rows: 0fr` would be
       the shorter spelling, but a 0fr track in an auto-height grid container
       sizes to its content, so it never collapses. */
    /* The stack fills the body, so an open section has free space to grow into. */
    .sections { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .section { display: flex; flex-direction: column; min-height: 34px; flex: 0 1 auto; transition: flex-grow 180ms ease; }
    .section.open { flex-grow: 1; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      flex: none;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 7px 14px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: left;
    }
    .section-head:hover { background: var(--elev); color: var(--fg); }
    .section-head:focus-visible { outline: 1px solid var(--fg); outline-offset: -1px; color: var(--fg); }
    .section-caret { flex: none; display: grid; place-items: center; width: 10px; transition: transform 160ms ease; }
    .section.open .section-caret { transform: rotate(90deg); }
    .section-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .section-counts { flex: none; display: flex; gap: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .section-counts .same { color: var(--fainter); }
    .section-body { flex: 1 1 0; min-height: 0; overflow: hidden; }
    .section.open .section-body { overflow-y: auto; }
    /* Rows line up under the section's title, past the caret and its gap. The
       `#detail` prefix is needed: `#detail button.row` above carries the id. */
    #detail .section-body button.row { padding: 4px 14px 4px 32px; }
    @media (prefers-reduced-motion: reduce) { .section, .section-caret { transition: none; } }
    #detail ul { list-style: none; margin: 8px 0 0; padding: 0; }
    #detail li { padding: 3px 0; border-top: 1px solid var(--line); overflow: hidden; }
    #detail button.row {
      display: flex;
      width: 100%;
      min-width: 0;
      gap: 8px;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 0;
      border-bottom: 1px solid var(--elev);
      padding: 4px 2px;
    }
    .clip { display: block; min-width: 0; flex: 1; overflow: hidden; }
    .marquee { display: inline-block; white-space: nowrap; }
    #detail button.row .mark { margin-left: auto; flex: none; }
    #detail button.row:hover, #detail button.row.on { background: var(--elev); }
    .added { color: var(--added-text); }
    .removed { color: var(--removed-text); }
    .modified { color: var(--modified-text); }
    .moved { color: var(--moved-text); }
    .tally span { margin-left: 8px; white-space: nowrap; }
    #tag {
      position: fixed;
      transform: translate(-50%, -140%);
      color: var(--fg);
      font-size: 12px;
      text-shadow: 0 1px 8px var(--shadow);
      pointer-events: none;
      display: none;
    }
    #note { color: var(--muted); }
    #search-wrap { position: relative; }
    #search {
      width: 100%;
      box-sizing: border-box;
      background: var(--search);
      color: var(--fg);
      border: 1px solid var(--line-strong);
      padding: 7px 10px;
    }
    #search:focus { outline: 1px solid var(--fg); outline-offset: 1px; }
    #results {
      position: fixed;
      z-index: 6;
      max-height: 280px;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #results button {
      display: flex;
      gap: 10px;
      width: 100%;
      min-width: 0;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 7px 10px;
      color: var(--fg);
    }
    #results button.on, #results button:hover { background: var(--on); }
    #results .kind { color: var(--muted); width: 72px; flex: none; }
    #results .where { color: var(--muted); margin-left: auto; flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .keys-title { margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
    .keys { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .keys li { color: var(--muted); min-width: 0; }
    .keys kbd { color: var(--fg); }
    #legend {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }
    #legend[hidden] { display: none; }
    .legend-card {
      width: min(680px, calc(100vw - 48px));
      max-height: min(82vh, 760px);
      overflow: auto;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      padding: 16px 18px 20px;
    }
    .legend-card header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .legend-card header h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .legend-card header button { margin-left: auto; background: var(--bg); color: var(--muted); border: 1px solid var(--line-strong); padding: 4px 8px; }
    .ex {
      display: flex;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 1px solid transparent;
      border-bottom: 1px solid var(--line);
      padding: 5px 4px;
    }
    .ex:hover, .ex.open { background: var(--elev); border-color: var(--line); }
    .ex b { display: block; font-weight: 600; margin-bottom: 2px; }
    .ex p { margin: 0; color: var(--muted); }
    .fig {
      width: 72px;
      height: 48px;
      flex: none;
      background: var(--elev);
      border: 1px solid var(--line);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      padding-bottom: 8px;
      box-sizing: border-box;
    }
    .fig i { display: block; }
    .fig .pkg { width: 48px; height: 26px; background: var(--package); align-self: flex-end; }
    .fig .fn { width: 10px; height: 34px; background: var(--function); }
    .fig .fn.short { height: 18px; }
    .fig .method { width: 10px; height: 24px; background: var(--method); }
    .fig .type { width: 30px; height: 16px; background: var(--type); align-self: flex-end; }
    .fig .add { width: 10px; height: 32px; background: var(--added); }
    .fig .del { width: 10px; height: 32px; background: var(--removed); }
    .fig .mod { width: 10px; height: 28px; background: var(--modified); }
    .fig svg { width: 72px; height: 48px; }
    #tour-side, #skin-side {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 380px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--panel);
      border-left: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #tour-side[hidden], #skin-side[hidden], #tour-drop[hidden] { display: none; }
    #tour-side.is-collapsed {
      bottom: auto;
      left: auto;
      width: 44px;
      height: 44px;
      border: 0;
      overflow: hidden;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #tour-side.is-collapsed > :not(#tour-logo) { display: none; }
    #tour-logo {
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      background: var(--panel);
      color: var(--accent);
      border: 0;
      border-left: 1px solid var(--edge);
      border-bottom: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #tour-side.is-collapsed #tour-logo { display: grid; }
    #tour-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); min-width: 0; }
    #tour-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #tour-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 14px; letter-spacing: 0.08em; white-space: nowrap; }
    #tour-tools { display: flex; align-items: center; gap: 4px; flex: none; }
    #tour-toggle, #tour-close {
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    #tour-toggle:hover, #tour-close:hover { color: var(--fg); border-color: var(--line-strong); }
    #tour-range { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tour-range code { color: var(--muted); }
    #tour-scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 12px 14px 18px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    #tour-count { color: var(--faint); font-size: 11px; letter-spacing: 0.08em; }
    #tour-step-title { margin: 2px 0 8px; font-size: 14px; font-weight: 600; }
    #tour-body { color: var(--dim); }
    #tour-body p { margin: 0 0 8px; }
    #tour-body ul, #tour-body ol { margin: 0 0 8px; padding-left: 18px; }
    #tour-body h3, #tour-body h4, #tour-body h5 { margin: 10px 0 6px; font-size: 13px; }
    #tour-body code { background: var(--elev); border: 1px solid var(--line); padding: 0 3px; color: var(--code); }
    #tour-body pre { background: var(--elev); border: 1px solid var(--line); padding: 8px; overflow-x: auto; }
    #tour-body pre code { border: 0; padding: 0; color: var(--pre); }
    #tour-body a { color: var(--link); }
    #tour-code { margin-top: 10px; }
    #tour-code[hidden] { display: none; }
    .tour-code-head { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .tour-code-head .change-added { color: var(--added-line); }
    .tour-code-head .change-removed { color: var(--removed-line); }
    .tour-code-head .change-modified { color: var(--modified-line); }
    #tour-code pre { margin: 0; font-size: 11px; line-height: 1.45; max-height: 40vh; overflow: auto; background: var(--code-bg); border: 1px solid var(--line); padding: 6px 0; tab-size: 4; }
    #tour-code .ln { display: block; min-width: 100%; width: max-content; box-sizing: border-box; padding: 0 8px; white-space: pre; }
    #tour-code .ln-add { background: var(--added-bg); color: var(--added-fg); }
    #tour-code .ln-del { background: var(--removed-bg); color: var(--removed-fg); }
    #tour-code .ln-same { color: var(--muted); }
    #tour-road-title {
      margin: 16px 0 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
    }
    #tour-steps { margin: 0; padding: 0; list-style: none; counter-reset: step; }
    #tour-steps li { counter-increment: step; border-top: 1px solid var(--line); }
    #tour-steps button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 2px solid transparent;
      color: var(--muted);
      padding: 4px 8px;
    }
    #tour-steps button::before { content: counter(step) ". "; color: var(--fainter); }
    #tour-steps button:hover { color: var(--fg); background: var(--elev); }
    #tour-steps li.is-done button { color: var(--faint); }
    #tour-steps li.is-current button { color: var(--fg); border-left-color: var(--accent); background: var(--current-bg); }
    #tour-controls { display: flex; align-items: center; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
    #tour-controls button { width: 30px; height: 26px; background: transparent; border: 1px solid var(--line); color: var(--pre); padding: 0; }
    #tour-controls button:hover:not(:disabled) { border-color: var(--line-strong); color: var(--fg); }
    #tour-controls button:disabled { opacity: 0.35; cursor: default; }
    #tour-counter { min-width: 52px; text-align: center; color: var(--muted); font-size: 12px; }
    #tour-progress { flex: 1; height: 3px; background: var(--line); overflow: hidden; }
    #tour-progress i { display: block; height: 100%; width: 0; background: var(--accent); }
    #tour-keys { padding: 0 14px 12px; color: var(--fainter); font-size: 11px; }
    #tour-keys kbd { color: var(--muted); }
    @keyframes tour-progress { from { width: 0; } to { width: 100%; } }
    #skin-side:focus { outline: none; }
    #skin-side:focus-visible { outline: none; }
    #skin-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); min-width: 0; }
    #skin-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #skin-title { flex: 1; min-width: 0; font-size: 14px; letter-spacing: 0.08em; }
    #skin-close {
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    #skin-close:hover { color: var(--fg); border-color: var(--line-strong); }
    #skin-note { color: var(--faint); font-size: 11px; }
    #skin-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    #skin-list { list-style: none; margin: 0; padding: 0; }
    #skin-list button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 9px 14px;
      color: var(--fg);
    }
    #skin-list button.on { background: var(--on); }
    #skin-list button:hover { background: var(--on); }
    #skin-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #skin-list .tag { flex: none; color: var(--faint); font-size: 11px; }
    #skin-actions { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 8px; }
    #skin-save {
      flex: 1;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line-strong);
      padding: 8px 10px;
    }
    #skin-save:disabled { color: var(--faint); border-color: var(--line); }
    #skin-save:not(:disabled):hover { background: var(--on); }
    #tour-drop {
      position: fixed;
      inset: 12px;
      z-index: 20;
      display: grid;
      place-items: center;
      border: 2px dashed var(--drop-border);
      background: var(--drop);
      color: var(--code);
      font-size: 16px;
      pointer-events: none;
    }
    #detail .refs { margin: 8px 0 6px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="work">
      <aside id="side">
        <button id="side-logo" type="button" aria-label="Show sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="2" y="13" width="6" height="9" fill="var(--package)"/>
            <rect x="9" y="5" width="5" height="17" fill="var(--function)"/>
            <rect x="16" y="9" width="6" height="13" fill="var(--modified)"/>
          </svg>
        </button>
        <div id="side-head">
          <div id="title-row">
            <div id="title">citydiff</div>
            <div id="side-tools">
              <button id="side-help" type="button" aria-label="Help">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M6.1 6.25a1.95 1.95 0 0 1 3.8.75c0 1.2-1.9 1.5-1.9 2.65" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="8" cy="11.85" r="0.7" fill="currentColor"/>
                </svg>
              </button>
              <button id="side-toggle" type="button" aria-label="Hide sidebar">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="modes">
            <button id="mode-overview" class="on" type="button">Overview</button>
            <button id="mode-changes" type="button">Changes</button>
          </div>
          <div id="search-wrap">
            <input id="search" type="search" placeholder="Find, or / for commands" autocomplete="off" spellcheck="false" />
          </div>
          <div id="crumb"></div>
          <div id="note"></div>
        </div>
        <div id="detail">
          <div id="detail-head"></div>
          <div id="detail-body"></div>
        </div>
      </aside>
      <aside id="skin-side" tabindex="-1" hidden>
        <div id="skin-head">
          <div id="skin-title-row">
            <div id="skin-title">theme</div>
            <button id="skin-close" type="button" aria-label="Close themes" title="Close (esc)">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </div>
          <div id="skin-note">Click a theme to preview it. Save keeps it.</div>
        </div>
        <div id="skin-scroll"><ul id="skin-list"></ul></div>
        <div id="skin-actions"><button id="skin-save" type="button" disabled>Save</button></div>
      </aside>
      <aside id="tour-side" hidden>
        <button id="tour-logo" type="button" aria-label="Show tour" title="Show tour (t)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3 L12 8 L5 13 Z" fill="currentColor"/></svg>
        </button>
        <div id="tour-head">
          <div id="tour-title-row">
            <div id="tour-title">tour</div>
            <div id="tour-tools">
              <button id="tour-close" type="button" aria-label="Close tour" title="Close tour">
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
              <button id="tour-toggle" type="button" aria-label="Hide tour" title="Hide tour (t)">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div id="tour-range"></div>
        </div>
        <div id="tour-scroll">
          <div id="tour-count"></div>
          <h2 id="tour-step-title"></h2>
          <div id="tour-body"></div>
          <div id="tour-code" hidden></div>
          <h3 id="tour-road-title">Roadmap</h3>
          <ol id="tour-steps"></ol>
        </div>
        <div id="tour-controls">
          <button type="button" id="tour-prev" title="Previous step (,)">‹</button>
          <button type="button" id="tour-play" title="Play or pause (space)">▶</button>
          <button type="button" id="tour-next" title="Next step (.)">›</button>
          <span id="tour-counter"></span>
          <div id="tour-progress"><i></i></div>
        </div>
        <div id="tour-keys"><kbd>space</kbd> play · <kbd>,</kbd> <kbd>.</kbd> step · <kbd>t</kbd> hide</div>
      </aside>
      <div id="tour-drop" hidden>Drop a tour script</div>
      <div id="results" hidden></div>
      <div id="stage">
        <div id="view"></div>
      </div>
    </div>
  </div>
  <div id="tag"></div>
  <div id="legend" hidden>
    <div class="legend-card">
      <header>
        <h2>Legend</h2>
        <button id="legend-close" type="button">esc</button>
      </header>
      <button class="ex" type="button">
        <div class="fig"><i class="pkg"></i></div>
        <div><b>Package</b><p>The building. Packages inside it stand on its roof. The name sits on each face, just under the top.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="type"></i></div>
        <div><b>Type</b><p>A wide pale block. It holds the methods declared on that type.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="fn"></i></div>
        <div><b>Function</b><p>A tower. Only the function in the call stays raised. The others on that package shut.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="method"></i></div>
        <div><b>Method</b><p>A gray tower on the same package as its type.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="fn short"></i><i class="fn"></i></div>
        <div><b>Size</b><p>Tower height is the body size. A longer body stands taller.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="add"></i></div>
        <div><b class="added">Added</b><p>Green is new in this diff. A green tower was added. A green arc is a call that was added.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="del"></i></div>
        <div><b class="removed">Deleted</b><p>Red is gone. A red block is a deleted package or function. A red arc is a call that was deleted.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="mod"></i></div>
        <div><b class="modified">Changed</b><p>Yellow is a package or function that changed. Its size stays the size of the body.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig">
          <svg viewBox="0 0 84 64" aria-hidden="true">
            <path d="M10 54 Q42 6 74 50" fill="none" stroke="var(--call)" stroke-width="2"/>
            <rect x="6" y="50" width="8" height="12" fill="var(--function)"/>
            <rect x="70" y="46" width="8" height="16" fill="var(--function)"/>
          </svg>
        </div>
        <div><b>Call</b><p>One smooth arc from the top of the caller to the top of the function it calls. Cyan means the call stayed. Several calls to the same function share that one arc. The Calls / Callers buttons under the selected node, or the <kbd>c</kbd> key, draw the other direction: the functions that call the selected node. The arcs are the same, and the particles run the other way, back toward it.</p></div>
      </button>
      <h3 class="keys-title">Keys</h3>
      <ul class="keys" id="keys"></ul>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
