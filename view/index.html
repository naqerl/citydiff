    html.theme-ready {

        --bg 0.45s ease, --elev 0.45s ease, --panel 0.45s ease, --search 0.45s ease,
        --fg 0.45s ease, --dim 0.45s ease, --muted 0.45s ease, --faint 0.45s ease, --fainter 0.45s ease,

    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
    body { font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    #detail, #results, .legend-card, #diff-body {
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }
    #detail::-webkit-scrollbar,
    #results::-webkit-scrollbar,
    .legend-card::-webkit-scrollbar,
    #diff-body::-webkit-scrollbar { width: 6px; height: 0; }
    /* The diff scrolls sideways too — a line can be longer than the panel —
       so its bar keeps the height the sidebar's does not need. */
    #diff-body::-webkit-scrollbar { height: 6px; }
    #detail::-webkit-scrollbar-thumb,
    #results::-webkit-scrollbar-thumb,
    .legend-card::-webkit-scrollbar-thumb,
    #diff-body::-webkit-scrollbar-thumb { background: var(--line-strong); }
    #detail::-webkit-scrollbar-track,
    #results::-webkit-scrollbar-track,
    .legend-card::-webkit-scrollbar-track,
    #diff-body::-webkit-scrollbar-track { background: transparent; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    #app { height: 100%; background: var(--bg); }
    #work { height: 100%; min-height: 0; display: flex; position: relative; }
    #side {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 340px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--panel);
      border-right: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #side.is-collapsed {
      bottom: auto;
      width: 44px;
      height: 44px;
      border: 0;
      overflow: hidden;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #side.is-collapsed #side-head,
    #side.is-collapsed #detail { display: none; }
    #side-logo {
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      background: var(--panel);
      border: 0;
      border-right: 1px solid var(--edge);
      border-bottom: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #side.is-collapsed #side-logo { display: grid; }
    #side-head { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
    #title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #title { flex: 1; min-width: 0; overflow: hidden; font-size: 14px; letter-spacing: 0.08em; text-transform: lowercase; white-space: nowrap; }
    #side-tools { display: flex; align-items: center; gap: 4px; flex: none; }
    #side-toggle, #side-help, #side-theme {
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      /* A solid plate, like the tour's player buttons: the glyph reads over
         the city instead of the frosted panel's blur. */
      background: var(--elev);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    #side-toggle:hover, #side-help:hover, #side-theme:hover { background: var(--line); color: var(--fg); border-color: var(--line-strong); }
    .modes { display: flex; gap: 0; }
    .modes button {
      flex: 1;
      /* The quiet tab is a recess, not a grey plate: the panel colour itself,
         nearly opaque, so the city inside it stays a soft blur and the raised
         plate of the tab that is on is a real step away from it. */
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--muted);
      border: 1px solid var(--line);
      /* Each tab draws its own left edge and none of its right, so the line
         between two of them belongs to the tab on the right — except when the
         tab on the left is active, which owns the divider (see below). */
      border-right: 0;
      padding: 6px 8px;
    }
    .modes button:last-child { border-right: 1px solid var(--line); }
    /* The active tab draws all four of its own edges, including the one it
       shares with the tab on its right: that divider belongs to the active
       tab's outline, not to the quiet edge of the neighbour. The neighbour
       drops its own left edge so the shared line stays one pixel wide. It is
       solid: no blur, a plate the eye reads as "this one is on". */
    .modes button.on { color: var(--fg); background: var(--elev); backdrop-filter: none; -webkit-backdrop-filter: none; border-color: var(--line-strong); border-right: 1px solid var(--line-strong); }
    .modes button.on + button { border-left: 0; }
    #stage { position: absolute; inset: 0; background: var(--bg); }
    #view { position: absolute; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }
    /* The loading scene sits over the canvas, inside the viewbox, until the
       city is built. On a large codebase that is several seconds, and an empty
       canvas is no sign that anything is happening. It is behind the sidebars
       (which carry their own z-index), so only the viewbox is covered. */
    #load {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: var(--bg);
    }
    #load[hidden] { display: none; }
    #load .load-box { width: min(340px, 62%); }
    #load .load-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: var(--muted); }
    #load .load-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #load .load-percent { flex: none; color: var(--faint); font-size: 11px; }
    #load .load-track { height: 3px; background: var(--line); overflow: hidden; }
    #load .load-bar { display: block; height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform 120ms linear; }
    @media (prefers-reduced-motion: reduce) { #load .load-bar { transition: none; } }
    /* The node's own header never scrolls away: the panel is a fixed head and a
       body of sections, and each section's rows scroll inside the section. What
       the head says — the name, the path, the counts — carries the same opaque
       plate the expander titles do, so it reads over the city; but the plate is
       the text's, no wider, and the frosted sidebar stands around it. The same
       10px under the plate is its own only when it is the last thing in the
       head: the range view has no Calls / Callers row to leave that gap, and a
       package that does must not get the gap twice. */
    #detail { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    #detail-head { flex: none; min-width: 0; padding: 0; }
    #detail-head .head-plate {
      margin: 10px 10px 0;
      padding: 10px 12px 8px;
      background: var(--elev);
      border: 1px solid var(--line);
      min-width: 0;
    }
    #detail-head .head-plate:last-child { margin-bottom: 10px; }
    #detail-head .head-plate > :last-child { margin-bottom: 0; }
    /* The Calls / Callers pair is its own row under the plate, on the frosted
       panel: the city blurs in the space between the head, the pair and the
       list the pair switches. */
    #detail-head .modes.refs { margin: 10px 10px 8px; }
    #detail-body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 0; }
    #detail h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; }
    #detail p { margin: 0 0 8px; color: var(--muted); overflow: hidden; }

    /* Sections. An open one takes a share of the body and scrolls its own rows,
       so the other sections keep their headers on screen. */
    /* A collapsed section is its header: the body's flex basis is 0, so it
       contributes nothing until the section grows. Opening animates flex-grow,
       and an open body scrolls its own rows. `grid-template-rows: 0fr` would be
       the shorter spelling, but a 0fr track in an auto-height grid container
       sizes to its content, so it never collapses. */
    /* The stack fills the body, so an open section has free space to grow into. */
    .sections { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    /* The section is its header plus whatever the body is given. A min-height
       here would be handed to the body — whose flex-grow is 1 — and a few
       pixels of clipped rows would show under a folded header. The header
       itself never shrinks, so a crowded panel scrolls instead of hiding it. */
    .section { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; transition: flex-grow 180ms ease; }
    .section.open { flex-grow: 1; }
    /* The expander titles and their rows carry the same opaque panel colour
       the tour's text and diff do, so the list reads over the city instead of
       with the city behind it. */
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      flex: none;
      background: var(--elev);
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 7px 14px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: left;
    }
    /* A hover wash over the opaque title: the colour the bar already has,
       one step lighter, so the hover is felt and the opaque bar stays. */
    .section-head:hover { background-image: linear-gradient(var(--edge), var(--edge)); color: var(--fg); }
    .section-head:focus-visible { outline: 1px solid var(--fg); outline-offset: -1px; color: var(--fg); }
    .section-caret { flex: none; display: grid; place-items: center; width: 10px; transition: transform 160ms ease; }
    .section.open .section-caret { transform: rotate(90deg); }
    .section-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .section-counts { flex: none; display: flex; gap: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .section-counts .same { color: var(--fainter); }
    .section-counts .total { color: var(--faint); }
    .section-body { flex: 1 1 0; min-height: 0; overflow: hidden; }
    .section.open .section-body { overflow-y: auto; }
    /* Rows line up under the section's title, past the caret and its gap. The
       `#detail` prefix is needed: `#detail button.row` above carries the id. */
    #detail .section-body button.row { padding: 4px 14px 4px 32px; }
    /* A list reads as a list when its rows alternate: the darker row, the
       lighter row, back and forth — the Finder list's stripe. The change of
       shade is the only separator there is; a rule between rows would just
       sit on top of a line the colour already draws, so the rows carry none. */
    #detail .section-body button.row:nth-child(odd) { background-color: var(--bg); }
    #detail .section-body button.row:nth-child(even) { background-color: var(--elev); }
    @media (prefers-reduced-motion: reduce) { .section, .section-caret { transition: none; } }
    #detail button.row {
      display: flex;
      width: 100%;
      min-width: 0;
      gap: 8px;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 0;
      padding: 4px 2px;
    }
    .clip { display: block; min-width: 0; flex: 1; overflow: hidden; }
    .marquee { display: inline-block; white-space: nowrap; }
    .marquee-track { display: inline-block; white-space: nowrap; }
    #detail button.row .mark { margin-left: auto; flex: none; }
    #detail button.row .mark.stats { display: flex; gap: 7px; }
    /* The package a reference lives in, so a hop out of this one is obvious. */
    #detail button.row .where { margin-left: auto; flex: none; color: var(--faint); font-size: 11px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* A package outside the snapshot: named in the same quiet grey its arc is
       drawn in, so the Calls list and the city agree on which hops leave it. */
    #detail button.row.ext .where { color: var(--call-std); }
    /* A hover or a selection washes the row it lands on without replacing the
       stripe under it: the gradient paints over the opaque colour, so the
       alternating list stays itself and the state still shows. The selected
       row comes after the hover, so it holds its own colour while hovered. */
    #detail button.row:hover { background-image: linear-gradient(var(--edge), var(--edge)); }
    #detail button.row.on {
      background-image:
        linear-gradient(var(--current-bg), var(--current-bg)),
        linear-gradient(var(--current-bg), var(--current-bg));
    }
    .added { color: var(--added-text); }
    .removed { color: var(--removed-text); }
    .modified { color: var(--modified-text); }
    .modified.body { color: var(--body-text); }
    .modified.both { color: var(--both-text); }
    .moved { color: var(--moved-text); }
    .tally span { margin-left: 8px; white-space: nowrap; }
    /* The counts on the Calls / Callers tabs sit off the label, in the same
       glyphs the tally lines use. The tab keeps one line whatever it holds. */
    .modes.refs button { white-space: nowrap; }
    .modes.refs button span { margin-left: 5px; white-space: nowrap; }
    /* A low level code change: the modified colour, muted, so the sentence
       and the badge read as the same quiet change the city draws. */
    .low-level { color: var(--modified-text); opacity: 0.7; }
    #detail button.row .mark.stats .low { color: var(--modified-text); opacity: 0.7; }
    #tag {
      position: fixed;
      transform: translate(-50%, -140%);
      color: var(--fg);
      font-size: 12px;
      text-shadow: 0 1px 8px var(--shadow);
      pointer-events: none;
      display: none;
    }
    #note { color: var(--muted); }
    #search-wrap { position: relative; }
    #search {
      width: 100%;
      box-sizing: border-box;
      background: var(--search);
      color: var(--fg);
      border: 1px solid var(--line-strong);
      padding: 7px 10px;
    }
    /* Focus recolours the border. An outline sits a pixel outside it and
       reads as a second ring. */
    #search:focus { outline: none; border-color: var(--fg); }
    #results {
      position: fixed;
      z-index: 6;
      max-height: 280px;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    /* Hover and the keyboard cursor used to share one wash, so the row Enter
       opens was not the row a pointer was over. The cursor keeps the wash and
       wears a thicker accent bar on its left edge. Every row reserves that
       bar, transparent until it is the cursor, so the labels do not jump. */
    #results button {
      display: flex;
      gap: 10px;
      width: 100%;
      min-width: 0;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-left: 3px solid transparent;
      padding: 7px 10px 7px 7px;
      color: var(--fg);
    }
    #results button:hover { background: var(--on); }

    /* The action ring (ring.js). It lives for one press, and the press is
       the pointer's, not the ring's: ring.js lights the item the pointer
       points at, so nothing here takes a pointer event. On a desktop it opens
       at the pointer over the running city. On a touch screen it opens in the
       middle of the screen, and the city behind it blurs and holds still, so
       that blur is worked out once. Everything else here is square, but a ring
       is round: the dial is a disc of glass, with no lines on it at all. */
    #ring {
      --ring-size: 240px;
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #ring[hidden] { display: none; }
    #ring.is-touch {
      --ring-size: min(264px, 80vw, 80vh);
      /* The blur keeps a stray second finger off the city under it. */
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: ring-scrim 180ms ease-out;
    }
    .ring-dial {
      position: absolute;
      width: var(--ring-size);
      height: var(--ring-size);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      /* Glass: a thin film of the panel colour with a pale sheen from the top,
         over a blur that lifts the colour of what is behind it. */
      background: linear-gradient(170deg, var(--edge), transparent 60%), var(--panel);
      background: linear-gradient(170deg, var(--edge), transparent 60%), color-mix(in srgb, var(--panel) 55%, transparent);
      backdrop-filter: blur(16px) saturate(1.6);
      -webkit-backdrop-filter: blur(16px) saturate(1.6);
      box-shadow: 0 18px 48px -18px var(--shadow);
      outline: none;
      animation: ring-in 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ring-dial[hidden] { display: none; }
    .ring-dial svg { display: block; width: 100%; height: 100%; overflow: visible; }
    /* The glyphs and words are the page's own text colours, flat on the
       glass. Nothing else is drawn on the ring but the lit item's slice. */
    .ring-icon { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: square; }
    .ring-item[data-id="deselect"] .ring-icon { stroke-dasharray: 2.5 2; }
    .ring-label, .ring-key { text-anchor: middle; }
    .ring-label { fill: var(--fg); font-size: 11px; }
    .ring-key { fill: var(--faint); font-size: 9.5px; }
    /* A finger has no keys to learn: no letters, and the glyph and its word
       drop to where the letter was, to sit in the middle of their slice. */
    #ring.is-touch .ring-key { display: none; }
    #ring.is-touch .ring-ink { transform: translateY(6px); }
    /* An item that is on (the bird view) has its glyph and word in the
       accent, at their usual weight; lit, it also has its slice and rim. */
    .ring-item.on .ring-icon { stroke: var(--accent); }
    .ring-item.on .ring-label { fill: var(--accent); }
    /* An item with nothing to act on keeps its place, so the ring is learned
       by where things are; only its glyph and words dim, like the player's. */
    .ring-item[aria-disabled="true"] .ring-icon { stroke: var(--faint); }
    .ring-item[aria-disabled="true"] .ring-label { fill: var(--faint); }
    .ring-item[aria-disabled="true"] .ring-key { fill: var(--fainter); }
    /* The lit item: its glyph and words in the skin's accent, and an accent
       rim along the outer edge of its slice; all of it at half strength when
       it cannot act. */
    /* A finger's cursor: a small square in the page's text colour, edged in
       its background so it shows over the glass and over a lit slice alike. */
    .ring-cursor { fill: var(--fg); stroke: var(--bg); stroke-width: 1.5; }
    .ring-rim { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: butt; stroke-opacity: 0; }
    .ring-item.is-hot .ring-rim { stroke-opacity: 1; }
    .ring-item.is-hot[aria-disabled="true"] .ring-rim { stroke-opacity: 0.5; }
    /* Its slice is shaded 15% darker, half that when it cannot act. Black,
       not a skin colour: darker is darker on every skin, and a light skin's
       shadow colour is white. */
    .ring-cell { fill: #000000; fill-opacity: 0; }
    .ring-item.is-hot .ring-cell { fill-opacity: 0.15; }
    .ring-item.is-hot[aria-disabled="true"] .ring-cell { fill-opacity: 0.075; }
    .ring-item.is-hot .ring-icon { stroke: var(--accent); }
    .ring-item.is-hot .ring-label, .ring-item.is-hot .ring-key { fill: var(--accent); }
    .ring-item.is-hot[aria-disabled="true"] .ring-icon { stroke: var(--accent); stroke-opacity: 0.5; }
    .ring-item.is-hot[aria-disabled="true"] .ring-label,
    .ring-item.is-hot[aria-disabled="true"] .ring-key { fill: var(--accent); fill-opacity: 0.5; }
    /* Why the lit item cannot act: one line right above the ring (under it
       when the ring is at the top of the screen), on the same glass. */
    .ring-why {
      position: absolute;
      transform: translate(-50%, -100%);
      max-width: calc(100vw - 24px);
      box-sizing: border-box;
      padding: 5px 10px;
      background: var(--panel);
      background: color-mix(in srgb, var(--panel) 55%, transparent);
      backdrop-filter: blur(16px) saturate(1.6);
      -webkit-backdrop-filter: blur(16px) saturate(1.6);
      color: var(--fg);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ring-why.is-below { transform: translate(-50%, 0); }
    .ring-why[hidden] { display: none; }
    #ring.is-touch .ring-why { font-size: 13px; }
    @keyframes ring-in { from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); } }

      #detail button.row, #detail .section-body button.row { padding-top: 9px; padding-bottom: 9px; }
      #results button { padding: 11px 10px 11px 7px; }
      #tour-steps button { padding: 9px 8px; }
      #tour-controls { gap: 8px; }
      #tour-controls button { width: 44px; height: 38px; }
      #tour-keys { display: none; }
      #diff, #editor { inset: 0; }
      /* Border-box, so the height editor.js sets from the visible viewport is
         the whole overlay, padding and key bar included, and nothing of it
         hangs below the screen or behind the keyboard. */
      #editor { box-sizing: border-box; padding: calc(4px + env(safe-area-inset-top)) 4px calc(4px + env(safe-area-inset-bottom)); }
      /* The diff fits the phone: no sideways scroll, long lines wrap under
         their own code column, and the gutters are narrower. */
      #diff-head { padding: calc(8px + env(safe-area-inset-top)) 10px 8px; gap: 8px; }
      #diff .diff-where, #diff .diff-note { display: none; }
      #diff .diff-close { padding: 8px 14px; }
      .diff-view { font-size: 11px; }
      .diff-view .diff-line { grid-template-columns: 2.8em 2.8em 1.2em minmax(0, 1fr); min-width: 0; white-space: pre-wrap; }
      .diff-view .diff-line code { padding-right: 8px; overflow-wrap: anywhere; }
      .legend-card { width: calc(100vw - 24px); max-height: calc(100dvh - 24px); padding: 14px; }
      .keys { grid-template-columns: 1fr; }

      /* A sidebar scrolls as one page, all the way down, instead of each
         section scrolling its own rows inside a fixed panel. */
      #side, #tour-side { overflow-y: auto; overscroll-behavior: contain; }
      #detail, #detail-body, .sections, .section, .section-body, #tour-scroll { flex: none; overflow: visible; min-height: auto; }
      .section:not(.open) .section-body { display: none; }
      .section.open .section-body { overflow: visible; }
      #tour-controls { position: sticky; bottom: 0; background: var(--panel); }

      /* The theme menu's buttons stand in for Enter, Escape and the arrows. */
      #skin-actions {
        position: absolute;
        z-index: 3;
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: auto;
      }
      #skin-actions button, #skin-find button {
        flex: none;
        min-width: 92px;
        padding: 11px 14px;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line-strong);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      #skin-actions button.primary { border-color: var(--fg); }
      #skin-hint { flex: 1; text-align: center; color: var(--fg); font-size: 12px; text-shadow: 0 0 12px var(--bg); }
      #skin-name { bottom: calc(84px + env(safe-area-inset-bottom)); left: 8%; right: 8%; }
      #skin-find {
        position: absolute;
        z-index: 3;
        top: calc(12px + env(safe-area-inset-top));
        right: 12px;
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      #skin-find button { min-width: 0; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
      #skin-search {
        width: min(58vw, 260px);
        box-sizing: border-box;
        padding: 9px 10px;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--fg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      #skin-search[hidden] { display: none; }
      #skin-search:focus { outline: none; }
    }

    /* Held sideways the sidebars stay sidebars, a little narrower. */
    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      #side { width: 300px; }
      #tour-side { width: 320px; }
    }

    /* Held upright the sidebars are one bottom sheet, the kind iOS and
       Android have: it rests at a detent (peek, half, full) and moves by a
       transform, never by resizing. Dragging it anywhere moves it; only at
       full does its content scroll, and pulling down from the top of that
       content takes the sheet down again. main.js (the sheet section) runs
       the gesture. With a tour the tabs under it pick which sidebar it shows,
       and on the tour tab the player sits between the two. */
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      body { --tabs-h: 0px; --player-h: 0px; --peek: 88px; --sheet-top: calc(40px + env(safe-area-inset-top)); }
      body.has-tour { --tabs-h: calc(48px + env(safe-area-inset-bottom)); }
      body.has-player { --player-h: 54px; }
      #sheet-tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 7;
        display: flex;
        height: 48px;
        padding-bottom: env(safe-area-inset-bottom);
        background: var(--panel);
        border-top: 1px solid var(--edge);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      body:not(.has-tour) #sheet-tabs, body.skin-open #sheet-tabs { display: none; }
      #sheet-tabs button {
        flex: 1;
        padding: 0;
        background: transparent;
        color: var(--muted);
        border: 0;
        border-right: 1px solid var(--line);
        letter-spacing: 0.08em;
      }
      #sheet-tabs button:last-child { border-right: 0; }
      /* The selected panel is marked along its bottom edge. */
      #sheet-tabs button.on { color: var(--fg); background: var(--on); box-shadow: inset 0 -2px 0 var(--accent); }

      /* On the tour tab the player rests on the tabs, so play and step stay in
         reach however far the sheet is folded. main.js moves it out of the
         tour sheet for this, and the sheet rests on top of it. The city tab
         has no player. */
      #work > #tour-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: var(--tabs-h);
        z-index: 7;
        height: var(--player-h);
        box-sizing: border-box;
        padding: 0 14px;
        background: var(--panel);
        border-top: 1px solid var(--edge);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      body:not(.has-player) #work > #tour-controls, body.skin-open #work > #tour-controls { display: none; }

      #side, #tour-side,
      #side.is-collapsed, #tour-side.is-collapsed {
        top: auto;
        left: 0;
        right: 0;
        bottom: calc(var(--tabs-h) + var(--player-h));
        width: auto;
        height: calc(100% - var(--tabs-h) - var(--player-h) - var(--sheet-top));
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom);
        overflow-x: hidden;
        overflow-y: hidden;
        /* The desktop sidebar's look: the city shows through, frosted. */
        background: var(--panel);
        border: 0;
        border-top: 1px solid var(--edge);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        /* Until main.js places it, the sheet rests at its peek. */
        transform: translateY(calc(100% - var(--peek)));
        will-change: transform;
      }
      body.has-tour #side, body.has-tour #tour-side { padding-bottom: 0; }
      body.sheet-full #side:not(.is-collapsed), body.sheet-full #tour-side:not(.is-collapsed) { overflow-y: auto; }
      body.sheet-tour #side, body:not(.sheet-tour) #tour-side { display: none; }
      #side.is-collapsed #side-logo, #tour-side.is-collapsed #tour-logo { display: none; }
      #side.is-collapsed #side-head, #side.is-collapsed #detail { display: flex; }
      #side.is-collapsed #side-head { border-bottom: 1px solid var(--line); }
      #tour-side.is-collapsed > #tour-head,
      #tour-side.is-collapsed > #tour-controls:not([hidden]) { display: flex; }
      #tour-side.is-collapsed > #tour-scroll { display: block; }
      #side.is-collapsed #title-row, #tour-side.is-collapsed #tour-title-row { cursor: pointer; }

      /* The sheet's handle: a square button sitting on the sheet's top edge,
         a third above it and two thirds on the sheet. A tap steps the sheet through
         its detents, a drag moves it, and a hold opens the action ring. It is
         outside the sheet, which clips what sticks out of it, and main.js
         (placeSheet) moves it with the sheet's top edge. Solid, like the
         player's buttons, so it reads over the city above the sheet, and
         outlined in the accent, so it reads as the thing to hold. */
      #sheet-handle {
        position: absolute;
        left: 50%;
        bottom: calc(var(--tabs-h) + var(--player-h));
        z-index: 6;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        box-sizing: border-box;
        padding: 0;
        background: var(--elev);
        color: var(--muted);
        border: 1px solid var(--accent);
        /* Until main.js places it, it sits on the peeking sheet's edge. */
        transform: translate(-50%, calc(44px * 2 / 3 - var(--peek)));
        will-change: transform;
        touch-action: none;
        cursor: grab;
      }
      body.skin-open #sheet-handle { display: none; }
      /* Two short bars, the grabber's own sign, in the muted text colour so
         it shows in every theme without shouting. Held, they widen over the
         time a hold takes to open the action ring, and the button lights. */
      #sheet-handle i {
        display: block;
        width: 16px;
        height: 2px;
        margin-top: -5px;
        background: currentColor;
        box-shadow: 0 5px 0 currentColor;
        transition: width 150ms ease;
      }
      #sheet-handle.is-holding { color: var(--accent); }
      #sheet-handle.is-holding i { width: 28px; transition: width 450ms linear; }
      /* The handle's lower two thirds lie over the top of the sheet: the head
         starts under them. */
      #side-head, #tour-head { padding-top: 34px; }

      /* The fold arrows point the way the sheet will go. */
      #side-toggle svg { transform: rotate(-90deg); }
      #side.is-collapsed #side-toggle svg { transform: rotate(90deg); }
      #tour-toggle svg { transform: rotate(90deg); }
      #tour-side.is-collapsed #tour-toggle svg { transform: rotate(-90deg); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
      "three/addons/loaders/GLTFLoader.js": "./vendor/loaders/GLTFLoader.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="work">
      <aside id="side">
        <button id="side-logo" type="button" aria-label="Show sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="2" y="13" width="6" height="9" fill="var(--package)"/>
            <rect x="9" y="5" width="5" height="17" fill="var(--function)"/>
            <rect x="16" y="9" width="6" height="13" fill="var(--modified)"/>
          </svg>
        </button>
        <div id="side-head">
          <div id="title-row">
            <div id="title">citydiff</div>
            <div id="side-tools">
              <button id="side-theme" type="button" aria-label="Theme">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <rect x="2.75" y="2.75" width="10.5" height="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M4 12 L12 4 L12 12 Z" fill="currentColor"/>
                </svg>
              </button>
              <button id="side-help" type="button" aria-label="Help">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M6.1 6.25a1.95 1.95 0 0 1 3.8.75c0 1.2-1.9 1.5-1.9 2.65" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="8" cy="11.85" r="0.7" fill="currentColor"/>
                </svg>
              </button>
              <button id="side-toggle" type="button" aria-label="Hide sidebar">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="modes">
            <button id="mode-overview" class="on" type="button">Overview</button>
            <button id="mode-changes" type="button">Changes</button>
          </div>
          <div id="search-wrap">
            <input id="search" type="search" placeholder="Find, or / for commands" autocomplete="off" spellcheck="false" />
          </div>
          <div id="note"></div>
        </div>
        <div id="detail">
          <div id="detail-head"></div>
          <div id="detail-body"></div>
        </div>
      </aside>
      <aside id="tour-side" hidden>
        <button id="tour-logo" type="button" aria-label="Show tour" title="Show tour (t)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3 L12 8 L5 13 Z" fill="currentColor"/></svg>
        </button>
        <div id="tour-head">
          <div id="tour-title-row">
            <div id="tour-title">tour</div>
            <div id="tour-tools">
              <button id="tour-toggle" type="button" aria-label="Hide tour" title="Hide tour (t)">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div id="tour-range"></div>
        </div>
        <div id="tour-scroll">
          <h2 id="tour-step-title"></h2>
          <div id="tour-body"></div>
        </div>
        <div id="tour-controls">
          <button type="button" id="tour-prev" title="Previous step (,)">‹</button>
          <button type="button" id="tour-play" title="Play or pause (space)">▶</button>
          <button type="button" id="tour-next" title="Next step (.)">›</button>
          <span id="tour-counter"></span>
          <div id="tour-progress"><i></i></div>
        </div>
        <div id="tour-keys"><kbd>space</kbd> play · <kbd>,</kbd> <kbd>.</kbd> step · <kbd>t</kbd> hide</div>
      </aside>
      <button id="sheet-handle" type="button" aria-label="Sheet: tap to open or close, drag to move, hold for actions"><i aria-hidden="true"></i></button>
      <div id="tour-drop" hidden>Drop a tour script</div>
      <div id="results" hidden></div>
      <nav id="sheet-tabs" aria-label="Panels">
        <button id="tab-side" type="button" aria-pressed="true">city</button>
        <button id="tab-tour" type="button" aria-pressed="false" hidden>tour</button>
      </nav>
      <div id="stage">
        <div id="view"></div>
        <div id="load" hidden role="progressbar" aria-label="Loading the city" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="load-box">
            <div class="load-head"><span class="load-label" id="load-label">Loading…</span><span class="load-percent" id="load-percent">0%</span></div>
            <div class="load-track"><i class="load-bar" id="load-bar"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="skin-menu" tabindex="-1" hidden role="dialog" aria-modal="true" aria-label="Theme">
    <button type="button" id="skin-prev" class="skin-wing" aria-label="Previous theme" tabindex="-1"></button>
    <button type="button" id="skin-next" class="skin-wing" aria-label="Next theme" tabindex="-1"></button>
    <svg id="skin-lines" aria-hidden="true">
      <line id="skin-line-prev"></line>
      <line id="skin-line-next"></line>
    </svg>
    <div id="skin-count"></div>
    <div id="skin-find">
      <input id="skin-search" type="search" placeholder="Find a theme" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" hidden>
      <button type="button" id="skin-find-open" aria-label="Find a theme">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.4 10.4 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>
    </div>
    <div id="skin-name"></div>
    <div id="skin-actions">
      <button type="button" id="skin-cancel">Cancel</button>
      <span id="skin-hint">‹ swipe ›</span>
      <button type="button" id="skin-apply" class="primary">Apply</button>
    </div>
  </div>
  <div id="tag"></div>
  <div id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="card">
      <h2 id="confirm-title">Keep this theme?</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button id="confirm-change" class="primary" type="button">Change</button>
        <button id="confirm-ignore" type="button">Ignore</button>
      </div>
    </div>
  </div>
  <div id="legend" hidden>
    <div class="legend-card">
      <header>
        <h2>Legend</h2>
        <span id="version" class="version"></span>
        <button id="legend-close" type="button">esc</button>
      </header>
      <button class="ex" type="button">
        <div class="fig"><i class="pkg"></i></div>
        <div><b>Package</b><p>The building. Packages inside it stand on its roof. The name sits on each face, just under the top.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="type"></i></div>
        <div><b>Type</b><p>A wide pale block. It holds the methods declared on that type.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="var"></i></div>
        <div><b>Variable</b><p>A const or a static: a short block, the same gray as a method. It has no body, so it stays low.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="fn"></i></div>
        <div><b>Function</b><p>A tower. Only the function in the call stays raised. The others on that package shut.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="method"></i></div>
        <div><b>Method</b><p>A gray tower on the same package as its type.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="fn short"></i><i class="fn"></i></div>
        <div><b>Size</b><p>Tower height is the body size. A longer body stands taller.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="add"></i></div>
        <div><b class="added">Added</b><p>Green is new in this diff. A green tower was added. A green arc is a call that was added.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="del"></i></div>
        <div><b class="removed">Deleted</b><p>Red is gone. A red block is a deleted package or function. A red arc is a call that was deleted.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="mod body"></i><i class="mod"></i><i class="mod both"></i></div>
        <div><b class="modified">Changed</b><p>Yellow is a package or a declaration that changed. On a function or a method, a darker yellow is a body change, this yellow is a signature change, and a brighter yellow is both. Its size stays the size of the body. A package whose file changed but whose declarations did not is a muted yellow: a low level code change.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig">
          <svg viewBox="0 0 84 64" aria-hidden="true">
            <path d="M10 54 Q42 6 74 50" fill="none" stroke="var(--call)" stroke-width="2"/>
            <rect x="6" y="50" width="8" height="12" fill="var(--function)"/>
            <rect x="70" y="46" width="8" height="16" fill="var(--function)"/>
          </svg>
        </div>
        <div><b>Call</b><p>One smooth arc from the top of the caller to the top of the function it calls. Cyan means the call stayed. Several calls to the same function share that one arc. The Calls / Callers buttons under the selected node, or the <kbd>c</kbd> key, draw the other direction: the functions that call the selected node. The arcs are the same, and the particles run the other way, back toward it.</p></div>
      </button>
      <h3 class="keys-title">Keys</h3>
      <ul class="keys" id="keys"></ul>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
