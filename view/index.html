  <title>citydiff</title>
  <style>

      --current-bg: rgba(255, 197, 61, 0.08);

      --syn-string: #fde68a;

    html.theme-ready {
      transition:
        --bg 0.45s ease, --elev 0.45s ease, --panel 0.45s ease, --search 0.45s ease,
        --fg 0.45s ease, --dim 0.45s ease, --muted 0.45s ease, --faint 0.45s ease, --fainter 0.45s ease,
        --line 0.45s ease, --line-strong 0.45s ease, --edge 0.45s ease, --shadow 0.45s ease,
        --link 0.45s ease, --code 0.45s ease, --accent 0.45s ease, --pre 0.45s ease,
        --added 0.45s ease, --removed 0.45s ease, --modified 0.45s ease, --body 0.45s ease, --both 0.45s ease, --moved 0.45s ease,
        --added-text 0.45s ease, --removed-text 0.45s ease, --modified-text 0.45s ease, --body-text 0.45s ease, --both-text 0.45s ease, --moved-text 0.45s ease,
        --call 0.45s ease, --function 0.45s ease, --method 0.45s ease, --type 0.45s ease, --package 0.45s ease,
        --added-bg 0.45s ease, --added-fg 0.45s ease, --removed-bg 0.45s ease, --removed-fg 0.45s ease,
        --added-line 0.45s ease, --removed-line 0.45s ease, --modified-line 0.45s ease,
        --code-bg 0.45s ease, --drop 0.45s ease, --drop-border 0.45s ease,
        --scrim 0.45s ease, --on 0.45s ease, --current-bg 0.45s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      html.theme-ready { transition: none; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
    body { font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    #detail, #results, .legend-card, #diff-body {
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }
    #detail::-webkit-scrollbar,
    #results::-webkit-scrollbar,
    .legend-card::-webkit-scrollbar,
    #diff-body::-webkit-scrollbar { width: 6px; height: 0; }
    /* The diff scrolls sideways too — a line can be longer than the panel —
       so its bar keeps the height the sidebar's does not need. */
    #diff-body::-webkit-scrollbar { height: 6px; }
    #detail::-webkit-scrollbar-thumb,
    #results::-webkit-scrollbar-thumb,
    .legend-card::-webkit-scrollbar-thumb,
    #diff-body::-webkit-scrollbar-thumb { background: var(--line-strong); }
    #detail::-webkit-scrollbar-track,
    #results::-webkit-scrollbar-track,
    .legend-card::-webkit-scrollbar-track,
    #diff-body::-webkit-scrollbar-track { background: transparent; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    #app { height: 100%; background: var(--bg); }
    #work { height: 100%; min-height: 0; display: flex; position: relative; }
    #side {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 340px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--panel);
      border-right: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #side.is-collapsed {
      bottom: auto;
      width: 44px;
      height: 44px;
      border: 0;
      overflow: hidden;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    #side.is-collapsed #side-head,
    #side.is-collapsed #detail { display: none; }
    #side-logo {
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      background: var(--panel);
      border: 0;
      border-right: 1px solid var(--edge);
      border-bottom: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #side.is-collapsed #side-logo { display: grid; }
    #side-head { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
    #title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #title { flex: 1; min-width: 0; overflow: hidden; font-size: 14px; letter-spacing: 0.08em; text-transform: lowercase; white-space: nowrap; }
    #side-tools { display: flex; align-items: center; gap: 4px; flex: none; }
    #side-toggle, #side-help, #side-theme {
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    #side-toggle:hover, #side-help:hover, #side-theme:hover { color: var(--fg); border-color: var(--line-strong); }
    .modes { display: flex; gap: 0; }
    .modes button {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      /* Each tab draws its own left edge and none of its right, so the line
         between two of them belongs to the tab on the right. That way the
         active tab is outlined in full on both sides, instead of borrowing a
         quiet edge from the tab next to it. */
      border-right: 0;
      padding: 6px 8px;
    }
    .modes button:last-child { border-right: 1px solid var(--line); }
    .modes button.on { color: var(--fg); background: var(--on); border-color: var(--line-strong); }
    #stage { position: absolute; inset: 0; background: var(--bg); }
    #view { position: absolute; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }
    /* The loading scene sits over the canvas, inside the viewbox, until the
       city is built. On a large codebase that is several seconds, and an empty
       canvas is no sign that anything is happening. It is behind the sidebars
       (which carry their own z-index), so only the viewbox is covered. */
    #load {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: var(--bg);
    }
    #load[hidden] { display: none; }
    #load .load-box { width: min(340px, 62%); }
    #load .load-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: var(--muted); }
    #load .load-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #load .load-percent { flex: none; color: var(--faint); font-size: 11px; }
    #load .load-track { height: 3px; background: var(--line); overflow: hidden; }
    #load .load-bar { display: block; height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform 120ms linear; }
    @media (prefers-reduced-motion: reduce) { #load .load-bar { transition: none; } }
    /* The node's own header never scrolls away: the panel is a fixed head and a
       body of sections, and each section's rows scroll inside the section. */
    #detail { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    #detail-head { flex: none; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
    #detail-body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 0; }
    #detail h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; }
    #detail p { margin: 0 0 8px; color: var(--muted); overflow: hidden; }

    /* Sections. An open one takes a share of the body and scrolls its own rows,
       so the other sections keep their headers on screen. */
    /* A collapsed section is its header: the body's flex basis is 0, so it
       contributes nothing until the section grows. Opening animates flex-grow,
       and an open body scrolls its own rows. `grid-template-rows: 0fr` would be
       the shorter spelling, but a 0fr track in an auto-height grid container
       sizes to its content, so it never collapses. */
    /* The stack fills the body, so an open section has free space to grow into. */
    .sections { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    /* The section is its header plus whatever the body is given. A min-height
       here would be handed to the body — whose flex-grow is 1 — and a few
       pixels of clipped rows would show under a folded header. The header
       itself never shrinks, so a crowded panel scrolls instead of hiding it. */
    .section { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; transition: flex-grow 180ms ease; }
    .section.open { flex-grow: 1; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      flex: none;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 7px 14px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: left;
    }
    .section-head:hover { background: var(--elev); color: var(--fg); }
    .section-head:focus-visible { outline: 1px solid var(--fg); outline-offset: -1px; color: var(--fg); }
    .section-caret { flex: none; display: grid; place-items: center; width: 10px; transition: transform 160ms ease; }
    .section.open .section-caret { transform: rotate(90deg); }
    .section-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .section-counts { flex: none; display: flex; gap: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .section-counts .same { color: var(--fainter); }
    .section-counts .total { color: var(--faint); }
    .section-body { flex: 1 1 0; min-height: 0; overflow: hidden; }
    .section.open .section-body { overflow-y: auto; }
    /* Rows line up under the section's title, past the caret and its gap. The
       `#detail` prefix is needed: `#detail button.row` above carries the id. */
    #detail .section-body button.row { padding: 4px 14px 4px 32px; }
    @media (prefers-reduced-motion: reduce) { .section, .section-caret { transition: none; } }
    #detail button.row {
      display: flex;
      width: 100%;
      min-width: 0;
      gap: 8px;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 0;
      border-bottom: 1px solid var(--elev);
      padding: 4px 2px;
    }
    .clip { display: block; min-width: 0; flex: 1; overflow: hidden; }
    .marquee { display: inline-block; white-space: nowrap; }
    .marquee-track { display: inline-block; white-space: nowrap; }
    #detail button.row .mark { margin-left: auto; flex: none; }
    #detail button.row .mark.stats { display: flex; gap: 7px; }
    /* The package a reference lives in, so a hop out of this one is obvious. */
    #detail button.row .where { margin-left: auto; flex: none; color: var(--faint); font-size: 11px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #detail button.row:hover, #detail button.row.on { background: var(--elev); }
    .added { color: var(--added-text); }
    .removed { color: var(--removed-text); }
    .modified { color: var(--modified-text); }
    .modified.body { color: var(--body-text); }
    .modified.both { color: var(--both-text); }
    .moved { color: var(--moved-text); }
    .tally span { margin-left: 8px; white-space: nowrap; }
    /* A low level code change: the modified colour, muted, so the sentence
       and the badge read as the same quiet change the city draws. */
    .low-level { color: var(--modified-text); opacity: 0.7; }
    #detail button.row .mark.stats .low { color: var(--modified-text); opacity: 0.7; }
    #tag {
      position: fixed;
      transform: translate(-50%, -140%);
      color: var(--fg);
      font-size: 12px;
      text-shadow: 0 1px 8px var(--shadow);
      pointer-events: none;
      display: none;
    }
    #note { color: var(--muted); }
    #search-wrap { position: relative; }
    #search {
      width: 100%;
      box-sizing: border-box;
      background: var(--search);
      color: var(--fg);
      border: 1px solid var(--line-strong);
      padding: 7px 10px;
    }
    #search:focus { outline: 1px solid var(--fg); outline-offset: 1px; }
    #results {
      position: fixed;
      z-index: 6;
      max-height: 280px;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--edge);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #results button {
      display: flex;
      gap: 10px;
      width: 100%;
      min-width: 0;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 7px 10px;
      color: var(--fg);
    }
    #results button.on, #results button:hover { background: var(--on); }
    #results .kind { color: var(--muted); width: 72px; flex: none; }
    #results .where { color: var(--muted); margin-left: auto; flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .keys-title { margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
    .keys { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .keys li { color: var(--muted); min-width: 0; }
    .keys kbd { color: var(--fg); }
    #editor {
      position: fixed;
      inset: 3vh 3vw;
      z-index: 50;
      background: #0d1017;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    #editor .editor-term { flex: 1; min-height: 0; }
    #editor .editor-msg {
      margin: 0;
      padding: 16px;
      color: #ffb4a8;
      font: 14px ui-monospace, monospace;
    }
    /* The diff overlay: the page's colours, not a terminal's. The two gutters
       are the file's line numbers, the sign column says what happened, and the
       code carries the skin's syntax colours. */
    #diff {
      position: fixed;
      inset: 3vh 3vw;
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: var(--elev);
      color: var(--fg);
      border: 1px solid var(--line-strong);
      box-shadow: 0 20px 60px var(--shadow);
      outline: none;
    }
    #diff-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
    #diff .diff-title { font-size: 14px; }
    #diff .diff-where, #diff .diff-note, #diff .diff-hint { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #diff .diff-note { color: var(--muted); }
    #diff .diff-spacer { flex: 1; }
    #diff-body { flex: 1; min-height: 0; overflow: auto; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #diff .diff-error { padding: 16px; color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
    #diff .diff-file-head { position: sticky; top: 0; margin: 0; padding: 7px 14px; background: var(--elev); border-bottom: 1px solid var(--line); color: var(--muted); font: 11px/1.4 ui-monospace, monospace; }
    #diff .diff-hunk { border-bottom: 1px solid var(--line); }
    #diff .diff-hunk-head { padding: 4px 14px; color: var(--faint); background: var(--code-bg); }
    #diff .diff-line { display: grid; grid-template-columns: 3.6em 3.6em 1.4em 1fr; min-width: max-content; white-space: pre; }
    #diff .diff-line.add { background: var(--added-bg); }
    #diff .diff-line.del { background: var(--removed-bg); }
    #diff .diff-no { padding-right: 10px; text-align: right; color: var(--fainter); user-select: none; }
    #diff .diff-sign { text-align: center; color: var(--faint); user-select: none; }
    #diff .diff-line.add .diff-sign { color: var(--added-line); }
    #diff .diff-line.del .diff-sign { color: var(--removed-line); }
    #diff .diff-line code { padding-right: 14px; }
    #diff .t-keyword { color: var(--syn-keyword); }
    #diff .t-string { color: var(--syn-string); }
    #diff .t-comment { color: var(--syn-comment); font-style: italic; }
    #diff .t-number { color: var(--syn-number); }
    #diff .t-type { color: var(--syn-type); }
    #diff .t-func { color: var(--syn-func); }
    #legend {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      display: flex;

          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3 L12 8 L5 13 Z" fill="currentColor"/></svg>
        </button>
        <div id="tour-grip" class="sheet-grip" aria-hidden="true"></div>
        <div id="tour-head">
          <div id="tour-title-row">
            <div id="tour-title">tour</div>
            <div id="tour-tools">
              <button id="tour-close" type="button" aria-label="Close tour" title="Close tour">
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
              <button id="tour-toggle" type="button" aria-label="Hide tour" title="Hide tour (t)">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div id="tour-range"></div>
        </div>
        <div id="tour-scroll">
          <h2 id="tour-step-title"></h2>
          <div id="tour-body"></div>
          <div id="tour-code" hidden></div>
        </div>
        <div id="tour-controls">
          <button type="button" id="tour-prev" title="Previous step (,)">‹</button>
          <button type="button" id="tour-play" title="Play or pause (space)">▶</button>
          <button type="button" id="tour-next" title="Next step (.)">›</button>
          <span id="tour-counter"></span>
          <div id="tour-progress"><i></i></div>
        </div>
        <div id="tour-keys"><kbd>space</kbd> play · <kbd>,</kbd> <kbd>.</kbd> step · <kbd>t</kbd> hide</div>
      </aside>
      <div id="tour-drop" hidden>Drop a tour script</div>
      <div id="results" hidden></div>
      <nav id="sheet-tabs" aria-label="Panels">
        <button id="tab-side" type="button" aria-pressed="true">city</button>
        <button id="tab-tour" type="button" aria-pressed="false" hidden>tour</button>
      </nav>
      <div id="stage">
        <div id="view"></div>
        <div id="load" hidden role="progressbar" aria-label="Loading the city" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="load-box">
            <div class="load-head"><span class="load-label" id="load-label">Loading…</span><span class="load-percent" id="load-percent">0%</span></div>
            <div class="load-track"><i class="load-bar" id="load-bar"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="skin-menu" tabindex="-1" hidden role="dialog" aria-modal="true" aria-label="Theme">
    <button type="button" id="skin-prev" class="skin-wing" aria-label="Previous theme" tabindex="-1"></button>
    <button type="button" id="skin-next" class="skin-wing" aria-label="Next theme" tabindex="-1"></button>
    <svg id="skin-lines" aria-hidden="true">
      <line id="skin-line-prev"></line>
      <line id="skin-line-next"></line>
    </svg>
    <div id="skin-count"></div>
    <div id="skin-find">
      <input id="skin-search" type="search" placeholder="Find a theme" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" hidden>
      <button type="button" id="skin-find-open" aria-label="Find a theme">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.4 10.4 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>
    </div>
    <div id="skin-name"></div>
    <div id="skin-actions">
      <button type="button" id="skin-cancel">Cancel</button>
      <span id="skin-hint">‹ swipe ›</span>
      <button type="button" id="skin-apply" class="primary">Apply</button>
    </div>
  </div>
  <div id="tag"></div>
  <div id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="card">
      <h2 id="confirm-title">Keep this theme?</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button id="confirm-change" class="primary" type="button">Change</button>
        <button id="confirm-ignore" type="button">Ignore</button>
      </div>
    </div>
  </div>
  <div id="legend" hidden>
    <div class="legend-card">
      <header>
        <h2>Legend</h2>
        <button id="legend-close" type="button">esc</button>
      </header>
      <button class="ex" type="button">
        <div class="fig"><i class="pkg"></i></div>
        <div><b>Package</b><p>The building. Packages inside it stand on its roof. The name sits on each face, just under the top.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="type"></i></div>
        <div><b>Type</b><p>A wide pale block. It holds the methods declared on that type.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="var"></i></div>
        <div><b>Variable</b><p>A const or a static: a short block, the same gray as a method. It has no body, so it stays low.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="fn"></i></div>
        <div><b>Function</b><p>A tower. Only the function in the call stays raised. The others on that package shut.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="method"></i></div>
        <div><b>Method</b><p>A gray tower on the same package as its type.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="fn short"></i><i class="fn"></i></div>
        <div><b>Size</b><p>Tower height is the body size. A longer body stands taller.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="add"></i></div>
        <div><b class="added">Added</b><p>Green is new in this diff. A green tower was added. A green arc is a call that was added.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="del"></i></div>
        <div><b class="removed">Deleted</b><p>Red is gone. A red block is a deleted package or function. A red arc is a call that was deleted.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig"><i class="mod body"></i><i class="mod"></i><i class="mod both"></i></div>
        <div><b class="modified">Changed</b><p>Yellow is a package or a declaration that changed. On a function or a method, a darker yellow is a body change, this yellow is a signature change, and a brighter yellow is both. Its size stays the size of the body. A package whose file changed but whose declarations did not is a muted yellow: a low level code change.</p></div>
      </button>
      <button class="ex" type="button">
        <div class="fig">
          <svg viewBox="0 0 84 64" aria-hidden="true">
            <path d="M10 54 Q42 6 74 50" fill="none" stroke="var(--call)" stroke-width="2"/>
            <rect x="6" y="50" width="8" height="12" fill="var(--function)"/>
            <rect x="70" y="46" width="8" height="16" fill="var(--function)"/>
          </svg>
        </div>
        <div><b>Call</b><p>One smooth arc from the top of the caller to the top of the function it calls. Cyan means the call stayed. Several calls to the same function share that one arc. The Calls / Callers buttons under the selected node, or the <kbd>c</kbd> key, draw the other direction: the functions that call the selected node. The arcs are the same, and the particles run the other way, back toward it.</p></div>
      </button>
      <h3 class="keys-title">Keys</h3>
      <ul class="keys" id="keys"></ul>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
