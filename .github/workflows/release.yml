name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  BIN_NAME: citydiff

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Build
        # CGO is required: the parser links the tree-sitter C bindings, so this
        # matrix is native-arch per runner instead of cross-compiling. That is
        # why linux/arm64 needs an arm64 runner (ubuntu-24.04-arm, free for
        # public repos) rather than GOARCH=arm64 on the amd64 one.
        env:
          CGO_ENABLED: '1'
        run: |
          echo "building $(go env GOOS)/$(go env GOARCH) on ${{ matrix.os }}"
          go build -trimpath -ldflags "-s -w" -o "dist/${BIN_NAME}" ./cmd/cli

      - name: Smoke test
        run: |
          printf 'package main\n\nfunc main() {}\n' > smoke.go
          "./dist/${BIN_NAME}" -path smoke.go -json > /dev/null

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          cd dist
          tar czf "${BIN_NAME}-${GITHUB_REF_NAME}-${goos}-${goarch}.tar.gz" "${BIN_NAME}"

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.tar.gz

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        # make test is vet, the Go tests and the viewer's node tests. Without
        # this job a broken test target reaches main unnoticed: the build jobs
        # only vet. CGO is required, as in the build job.
        env:
          CGO_ENABLED: '1'
        run: make test

  release:
    name: publish release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: sha256sum dist/*.tar.gz | sed 's#dist/##' > dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt