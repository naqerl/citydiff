name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Publish an image for a tag that predates the image jobs below. Nothing
  # else changes: the tag is named instead of being the ref that triggered the
  # run, because a workflow_dispatch always runs on a branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish an image for, for example v1.0.0. It must already exist.
        required: true
        type: string

permissions:
  contents: write

env:
  BIN_NAME: citydiff
  # Every image tag this workflow publishes lives under this repository.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Build
        # CGO is required: the parser links the tree-sitter C bindings, so this
        # matrix is native-arch per runner instead of cross-compiling. That is
        # why linux/arm64 needs an arm64 runner (ubuntu-24.04-arm, free for
        # public repos) rather than GOARCH=arm64 on the amd64 one.
        env:
          CGO_ENABLED: '1'
        run: |
          echo "building $(go env GOOS)/$(go env GOARCH) on ${{ matrix.os }}"
          # A tag build is that release: the legend shows the version and the
          # viewer checks this repository for a newer one. Any other build is a
          # development build and names its commit.
          ldflags="-s -w"
          case "$GITHUB_REF" in
            refs/tags/v*) ldflags="$ldflags -X main.version=${GITHUB_REF_NAME} -X main.releaseRepo=${GITHUB_REPOSITORY}" ;;
          esac
          go build -trimpath -ldflags "$ldflags" -o "dist/${BIN_NAME}" ./cmd/cli

      - name: Smoke test
        run: |
          printf 'package main\n\nfunc main() {}\n' > smoke.go
          "./dist/${BIN_NAME}" -path smoke.go -json > /dev/null

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          cd dist
          tar czf "${BIN_NAME}-${GITHUB_REF_NAME}-${goos}-${goarch}.tar.gz" "${BIN_NAME}"

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.tar.gz

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        # make test is vet, the Go tests and the viewer's node tests. Without
        # this job a broken test target reaches main unnoticed: the build jobs
        # only vet. CGO is required, as in the build job.
        env:
          CGO_ENABLED: '1'
        run: make test

  release:
    name: publish release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: sha256sum dist/*.tar.gz | sed 's#dist/##' > dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  # The container image is the release in a slimmer base, and it is how the
  # hub is deployed (`citydiff hub serve`). CGO forces a native runner per
  # architecture, exactly as in the build job, so each architecture pushes a
  # digest and a third job stitches the digests into one manifest list.
  image:
    name: image (${{ matrix.platform }})
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          # A tag push checks out its own tag; a dispatch checks out the tag it
          # names, so a backfilled image is built from the release's source.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version and commit
        id: source
        run: |
          echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: a manifest list cannot be assembled from
      # mutable tags, and nothing should see one architecture under a tag
      # while the other is still building.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: publish image manifest
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3, v1.2, v1 and latest, all the same manifest.
      - name: Resolve the tags
        id: tags
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          n="${VERSION#v}"
          major="${n%%.*}"
          rest="${n#*.}"
          minor="${rest%%.*}"
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:v${major}.${minor}"
            echo "${IMAGE}:v${major}"
            echo "${IMAGE}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          # A multi-line step output substituted with ${{ }} is pasted into
          # the script verbatim, which breaks it. Through the environment it
          # stays one value and the loop splits it on the newlines.
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          digests=()
          for f in *; do digests+=("${IMAGE}@sha256:${f}"); done
          docker buildx imagetools create "${args[@]}" "${digests[@]}"

      # A package published by GITHUB_TOKEN starts private even when its
      # repository is public, and the cluster pulls the image anonymously. The
      # workflow token carries packages: write, which is what the endpoint
      # wants. A failure here is not fatal to the build -- the image exists for
      # anyone with a token -- so it warns instead of failing the release.
      - name: Make the image public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${GITHUB_REPOSITORY#*/}"
          if [ "$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${pkg}" --jq .visibility 2>/dev/null)" = "public" ]; then
            echo "${pkg} is already public"
            exit 0
          fi
          gh api --method PATCH "user/packages/container/${pkg}" -f visibility=public
          echo "${pkg} is now public"